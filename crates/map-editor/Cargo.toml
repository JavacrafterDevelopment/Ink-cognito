[package]
name = "ink-map-editor"
version = "0.1.0"
edition = "2024"
description = "The Ink-cognito map editor: a separate program for building map files the game plays."
publish = false

[[bin]]
name = "ink-map-editor"
path = "src/main.rs"

[dependencies]
arboard = "3"
bevy = "0.20"
ink-map = { path = "../ink-map" }
# Live editing with friends: the game's Portside client and TailCat.
ink-portside = { path = "../ink-portside" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tailcat = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
