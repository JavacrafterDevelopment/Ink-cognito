[package]
name = "ink-model-editor"
version = "0.1.0"
edition = "2024"
description = "Standalone 3D model editor for GLB, glTF, OBJ, STL, and PLY files with texturing and 3D painting."
publish = false

[[bin]]
name = "ink-model-editor"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bevy = "0.20"
bytemuck = "1"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tga", "webp"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
