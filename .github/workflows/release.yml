# Builds Ink-cognito for Windows and macOS and publishes it as a GitHub release
# the Javacrafter Launcher can install and update. Any of these releases it:
#
#   - Bump `version` in Cargo.toml (e.g. 0.1.1) and merge that to main. The
#     push to main sees v0.1.1 has no release yet, builds, tags that commit
#     v0.1.1 and publishes. A push to main that doesn't change the version does
#     nothing here.
#   - Push a tag v0.1.1 by hand (it must match Cargo.toml).
#   - Create a release v0.1.1 on GitHub's website. Its tag push runs this, and
#     the packages are added to that release instead of making a new one.
#
# Either way a version is only ever built once: a release that already has the
# packages is left alone.
#
# Running this workflow by hand on any other branch is a test run: both
# builds and their tests run, nothing is tagged or published. A version with a hyphen (0.2.0-beta.1) is published
# as a pre-release, which the Launcher only offers on its beta channel.
#
# Windows: an MSVC build with the C runtime linked statically (see
# .cargo/config.toml), so the folder is just ink-cognito.exe, plus the map
# editor (ink-map-editor.exe) and standalone model editor (ink-model-editor.exe).
#
# macOS: Apple Silicon only (no Intel build), Ink-cognito.app, ad-hoc
# signed, with the map editor and model editor inside it and the assets in Contents/Resources.
#
# The release carries Ink-cognito-windows-x64.zip and Ink-cognito-macos.zip
# (each the game folder plus launcher-manifest.json, every file's SHA-256),
# which are what the Launcher downloads, and a .dmg for installing by hand.
# update.json and update-macos.json on the `updates` branch are how the
# Launcher finds and verifies updates without GitHub's API rate limit.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One release at a time, so two tags pushed together can't race on update.json.
# Test runs from other branches don't hold up (or get held up by) releases.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'release' || format('test-{0}', github.ref) }}

permissions:
  contents: write

jobs:
  # Which version this is, and whether it still needs building.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      mode: ${{ steps.v.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Cargo.toml and look for an existing release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="v$ver"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $ver" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Test run on $GITHUB_REF_NAME: building $tag without publishing."
            mode=test
          elif assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            if printf '%s\n' "$assets" | grep -qx 'Ink-cognito-windows-x64.zip' \
              && printf '%s\n' "$assets" | grep -qx 'Ink-cognito-macos.zip'; then
              echo "$tag is already released with its packages; nothing to do."
              mode=none
            else
              echo "$tag exists without packages; building them for it."
              mode=upload
            fi
          else
            echo "Releasing $tag."
            mode=create
          fi
          {
            echo "version=$ver"
            echo "tag=$tag"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    if: needs.version.outputs.mode != 'none'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked --workspace --target x86_64-pc-windows-msvc

      - name: Build
        # The whole workspace: the game, the map editor, and the model editor.
        run: cargo build --release --locked --workspace --target x86_64-pc-windows-msvc

      - name: Assemble the folder
        shell: pwsh
        run: |
          $dir = 'dist/Ink-cognito'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ink-cognito.exe $dir
          Copy-Item target/x86_64-pc-windows-msvc/release/ink-map-editor.exe $dir
          Copy-Item target/x86_64-pc-windows-msvc/release/ink-model-editor.exe $dir
          # Bevy loads anything under assets/ next to the exe.
          if (Test-Path assets) { Copy-Item -Recurse assets "$dir/assets" }

      - name: Package
        shell: pwsh
        run: ./tools/release-package.ps1 -Folder dist/Ink-cognito -Name Ink-cognito -Exe ink-cognito.exe -Version ${{ needs.version.outputs.version }} -Out release

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            release/Ink-cognito-windows-x64.zip
            release/release-entry.json

  build-macos:
    needs: version
    if: needs.version.outputs.mode != 'none'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      # Matches LSMinimumSystemVersion in tools/package-macos.sh.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # The runner is Apple Silicon: test the arm64 build, sharing its
      # artifacts with the build below instead of compiling twice.
      - name: Test
        run: cargo test --release --locked --workspace --target aarch64-apple-darwin

      - name: Build (Apple Silicon)
        run: cargo build --release --locked --workspace --target aarch64-apple-darwin

      - name: Package
        run: ./tools/package-macos.sh target/aarch64-apple-darwin/release/ink-cognito dist target/aarch64-apple-darwin/release/ink-map-editor target/aarch64-apple-darwin/release/ink-model-editor

      - name: Check the package
        run: |
          app=dist/Ink-cognito/Ink-cognito.app
          test -f "$app/Contents/Resources/assets/maps/Dockyard.json"
          codesign --verify --strict --verbose=2 "$app"
          # Unzipped the way the Launcher gets it: still signed and runnable.
          rm -rf unzip-check && mkdir unzip-check
          ditto -x -k dist/Ink-cognito-macos.zip unzip-check
          test -x unzip-check/Ink-cognito.app/Contents/MacOS/ink-cognito
          codesign --verify --strict --verbose=2 unzip-check/Ink-cognito.app

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/Ink-cognito-macos.zip
            dist/Ink-cognito-macos.dmg
            dist/release-entry-macos.json

  publish:
    needs: [version, build-windows, build-macos]
    if: needs.version.outputs.mode == 'create' || needs.version.outputs.mode == 'upload'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.version.outputs.tag }}'
          $assets = @('release/Ink-cognito-windows-x64.zip', 'dist/Ink-cognito-macos.zip')
          if (Test-Path 'dist/Ink-cognito-macos.dmg') { $assets += 'dist/Ink-cognito-macos.dmg' }
          if ('${{ needs.version.outputs.mode }}' -eq 'upload') {
            gh release upload $tag @assets --clobber
          } else {
            $pre = if ($tag -match '-') { '--prerelease' } else { $null }
            # --target tags this commit when the tag doesn't exist yet (a merge to main).
            gh release create $tag @assets --target '${{ github.sha }}' `
              --title "Ink-cognito $($tag.TrimStart('v'))" --generate-notes $pre
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # update.json (Windows) and update-macos.json (macOS) live on their own
      # `updates` branch so releases never add commits to main. The Launcher
      # reads them from raw.githubusercontent.com.
      - name: Publish update.json and update-macos.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ needs.version.outputs.tag }}'
          $repo = '${{ github.repository }}'
          $info = gh release view $tag --json body,isPrerelease | ConvertFrom-Json
          # Read raw: ConvertFrom-Json would turn the timestamp into a local-format date.
          $published = gh release view $tag --json publishedAt --jq .publishedAt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git ls-remote --heads origin updates) {
            git fetch --depth 1 origin updates
            git worktree add updates-branch FETCH_HEAD
          } else {
            # First release with update.json: start the branch with nothing else on it.
            git worktree add --detach updates-branch
            git -C updates-branch checkout --orphan updates
            git -C updates-branch rm -rf --quiet .
          }

          ./tools/publish-update.ps1 -Entry release/release-entry.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published $published

          ./tools/publish-update.ps1 -Entry dist/release-entry-macos.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update-macos.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published $published

          git -C updates-branch add update.json update-macos.json
          git -C updates-branch commit -m "update.json and update-macos.json for $tag"
          git -C updates-branch push origin HEAD:refs/heads/updates
